name: Build and Deploy to DEV
on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-dev"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular Application
        run: npm run build -- --configuration=development --base-href=/profile-page-dev/

      - name: Configure Routing Fallbacks
        run: cp dist/profile-page/browser/index.html dist/profile-page/browser/404.html

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist/profile-page/browser'

      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v5