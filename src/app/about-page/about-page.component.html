<div class="about-page-container">
      @if(userDetails$ | async; as details){
    <div class="about-page-header">
        <h3 class="name">{{details.firstName}} {{details.lastName}} - Florida, United States</h3>
    </div>
    <div class="page-title">
        <h1 class="title-text">Builder of Ideas From<br><span class="title-texture"> Concepts to Reality</span> </h1>
    </div>
    <div class="separator"></div>
    <div class="page-details">
        <p>{{details.mainText}}</p>
        <p class="subtext-details">{{details.subText}}</p>
    </div>
    <div class="page-buttons">
        <a class="projects-btn" routerLink="/projects">View Projects <svg class="about-project-icon" lucideArrowUpRight [size]="18" color="#F2EDE5" [strokeWidth]="1" title="Projects"></svg></a>
        <a class="book-btn" routerLink="/books"><svg class="about-book-icon" lucideBookOpen [size]="18" color="#1C1917" [strokeWidth]="1" title="Projects"></svg> Latest Book</a>
    </div>
}
@else{
    <loading-spinner></loading-spinner>
}
</div>
